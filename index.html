<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DG PMS">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column like a maintenance log; due list on top, job card opens as a full page with a pinned copy bar. */
:root{
  /* Single look taken from the DG PMS icon: navy ground, white cards, orange waves */
  --page:#0E3A5F; --page-ink:#FFFFFF; --page-muted:#AFC6DC; --page-deep:#0A2C48;
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#0E2A44; --muted:#5B6E82; --line:#C9D6E3;
  --navy:#0E3A5F; --orange:#F28C28; --orange-ink:#B85E0C; --orange-soft:#FDEBD8;
  --over:#B42318; --over-soft:#FDE4E1; --soon:#A86200; --soon-soft:#FFF1D6; --ok:#2E7D4F; --ok-soft:#E1F3E8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:11px;flex:none}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.waves{display:block;width:100%;height:22px;margin-top:-6px}
h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;margin:2px 0 0;text-wrap:balance;color:var(--page-ink)}
.sub{color:var(--page-muted);font-size:13px;margin:0}
.rchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rchips button{flex:none;font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:var(--page-ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.rchips button small{font-family:var(--f-mono);font-size:11px;opacity:.75}
.rchips button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.sum{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sum button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:0;min-width:0}
.sum b{font-family:var(--f-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.sum button{border-color:transparent}
.sum button[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange)}
.sum .over b{color:var(--over)}.sum .soon b{color:var(--soon)}.sum .okk b{color:var(--ok)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.job{box-shadow:0 1px 0 rgba(0,0,0,.12);border-color:transparent;display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;width:100%}
.job .bar{background:var(--line)}
.job.over .bar{background:var(--over)}.job.soon .bar{background:var(--soon)}.job.okk .bar{background:var(--ok)}
.job .mid{padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.job .nm{font-weight:600;line-height:1.3}
.job .tr{color:var(--muted);font-size:13px;line-height:1.3}
.job .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-variant-numeric:tabular-nums}
.job .right{padding:10px 12px 10px 0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.pill.over{background:var(--over-soft);color:var(--over)}.pill.soon{background:var(--soon-soft);color:var(--soon)}.pill.okk{background:var(--ok-soft);color:var(--ok)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.p{border-color:var(--orange);color:var(--orange-ink);background:var(--orange-soft)}
.empty{color:var(--page-muted);text-align:center;padding:24px}
/* detail */
.top{display:flex;align-items:center;gap:10px}
.brand img{box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.back{font:inherit;font-weight:600;border:0;background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.dh h2{font-family:var(--f-display);font-size:28px;line-height:1.05;margin:4px 0 0;color:var(--page-ink)}
.dh h2 span{display:block;font-size:18px;color:var(--page-muted);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.facts small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-variant-numeric:tabular-nums}
.lbl{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted)}
.setin .lbl{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.step.nd{border-left-color:var(--over)}.step.na{border-left-color:var(--line);opacity:.75}
.step .t{font-weight:600;line-height:1.3}.step .t span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--muted);padding:7px 4px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].d{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].n{background:var(--over);color:var(--surface)}
.seg button[aria-pressed="true"].x{background:var(--muted);color:var(--surface)}
.report{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:6px;padding:11px 14px;cursor:pointer;background:var(--navy);color:#fff}
.btn.o{background:var(--orange);color:#fff}
.btn.g{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
details.doc{background:var(--surface);border-radius:8px;padding:12px;color:var(--ink)}
details.doc summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.doc[open] summary{margin-bottom:10px}
.docin{display:flex;flex-direction:column;gap:10px}
.docin .lbl{color:var(--muted)}
.docin .note{color:var(--muted)}
.docin .report{border:1px solid var(--line);border-top:4px solid var(--orange)}
.gas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.gas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.hist b{font-family:var(--f-mono);font-weight:500}
.copybar{position:fixed;left:0;right:0;bottom:0;background:var(--page-deep);border-top:3px solid var(--orange);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.copybar .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:8px}
.copybar button{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border:0;border-radius:6px;padding:11px 6px;cursor:pointer;background:#fff;color:var(--navy)}
.copybar .save{background:var(--orange);color:var(--navy)}
#detail .wrap{padding-bottom:110px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--orange);color:var(--navy);font-weight:600;padding:8px 16px;border-radius:999px;font-size:14px;z-index:6;max-width:90vw;text-align:center}
.cloud{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ctitle{font-weight:600}
#cloudLine{margin-top:-10px}
details.set{background:var(--surface);border:0;border-radius:8px;padding:12px}
details.set summary{cursor:pointer;font-weight:600}
details.set[open] summary{margin-bottom:10px}
.setin{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--page-muted);margin:0}
details.set .note{color:var(--muted)}
#fallback{min-height:140px;font-family:var(--f-mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.job,.sum button{transition:border-color .15s,background .15s}}
</style>

<div id="listView">
<div class="wrap">
  <header class="brand">
    <img src="icons/icon-192.png" alt="" width="48" height="48" id="logo">
    <div><div class="eyebrow" id="eb" lang="en">DG PMS</div><h1>Planlı Bakım</h1></div>
  </header>
  <svg class="waves" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 9 C60 2 120 2 180 8 C240 14 300 14 400 6" fill="none" stroke="#F28C28" stroke-width="3.2" stroke-linecap="round"/><path d="M0 18 C70 12 130 12 190 16 C250 20 320 20 400 14" fill="none" stroke="#F28C28" stroke-width="3.2" stroke-linecap="round"/></svg>
  <p class="sub" id="today"></p>
  <p class="sub" id="cloudLine"></p>
  <div class="rchips" id="rchips" role="group" aria-label="Sorumlu"></div>
  <div class="sum" id="sum"></div>
  <input type="search" id="q" placeholder="İş ara: anchor, ballast, hatch…" aria-label="İş ara">
  <div class="list" id="list"></div>
  <details class="set" id="set">
    <summary>Ayarlar ve yedek</summary>
    <div class="setin">
      <div class="cloud">
        <div class="ctitle">Bulut eşitleme</div>
        <div id="cOff">
          <p class="note">SOF Defteri'ndeki kaptan hesabınla gir. Kayıtların telefonda ve bilgisayarda aynı olur. İnternet yokken uygulama yine çalışır, internet gelince eşitler.</p>
          <label class="lbl">E-posta veya kullanıcı adı<input id="cEm" type="email" autocomplete="username" placeholder="ornek@gmail.com"></label>
          <label class="lbl">Şifre<input id="cPw" type="password" autocomplete="current-password"></label>
          <div class="btnrow"><button class="btn o" id="cIn" type="button">Giriş yap</button></div>
        </div>
        <div id="cOn" hidden>
          <p class="note"><b>Bağlı:</b> <span id="cWho"></span></p>
          <div class="btnrow"><button class="btn g" id="cSync" type="button">Şimdi eşitle</button><button class="btn g" id="cOut" type="button">Çıkış yap</button></div>
        </div>
        <p class="note" id="cMsg"></p>
      </div>
      <label class="lbl">Gemi adı (raporda görünür)<input id="ship" placeholder="M/V ..."></label>
      <p class="note">Tarihler bu telefonda saklanır. Ara sıra yedek kodunu al ve kendine mesaj at.</p>
      <div class="btnrow"><button class="btn g" id="bkCopy" type="button">Yedek kodunu kopyala</button></div>
      <label class="lbl">Yedek kodunu yapıştır<input id="bkIn" placeholder="Yedek kodu"></label>
      <div class="btnrow"><button class="btn g" id="bkLoad" type="button">Geri yükle</button><button class="btn g" id="reset" type="button">Excel tarihlerine dön</button></div>
    </div>
  </details>
</div>
</div>

<div id="detail" hidden>
<div class="wrap" id="dwrap"></div>
<div class="copybar"><div class="in">
  <button id="cpBoth">Kopyala EN+TR</button><button id="cpEn">EN</button><button id="cpTr">TR</button><button class="save" id="saveDone">Kaydet</button>
</div></div>
</div>
<textarea id="fallback" hidden readonly></textarea>
<div class="toast" id="toast" hidden></div>

<script>
/* Risk assessment + permit content per work category.
   hz: [hazardEN, hazardTR, existingEN, existingTR, likelihood, consequence, furtherEN, furtherTR, who]
   likelihood: VU Very Unlikely, U Unlikely, L Likely, VL Very Likely; consequence: Mi Minor, Mo Moderate, Ex Extreme; who: R responsible, M Master, CE Chief Engineer */
const RA={
tank:{name:["Enclosed space / tank / cargo hold entry","Kapalı mahal / tank / ambar girişi"],
 loc:["Space concerned (specify tank / hold No.)","İlgili mahal (tank / ambar no. belirtin)"],
 scope:["Entry into an enclosed space under permit for inspection / maintenance. No hot work unless separately permitted.","Kontrol / bakım için izinli kapalı mahal girişi. Ayrıca izin verilmedikçe sıcak çalışma yoktur."],
 permit:{type:["Enclosed Space Entry Permit","Kapalı Mahal Giriş İzni"],party:"AB-1, AB-2 (attendant / gözcü: Oiler)",gas:true,
  ppe:["Helmet, coverall, safety shoes, gloves, goggles, personal gas detector, torch (intrinsically safe)","Baret, tulum, emniyet ayakkabısı, eldiven, gözlük, kişisel gaz ölçer, el feneri (ex-proof)"],
  checks:[["Space isolated: valves closed and tagged, pumps stopped and locked","Mahal izole edildi: valfler kapalı ve etiketli, pompalar durdurulup kilitlendi"],
   ["Space ventilated (forced ventilation running throughout entry)","Mahal havalandırıldı (giriş boyunca cebri havalandırma çalışıyor)"],
   ["Atmosphere tested at different levels before entry (readings below)","Girişten önce farklı seviyelerde atmosfer ölçüldü (değerler aşağıda)"],
   ["Re-test interval agreed; personal gas detectors carried by entrants","Tekrar ölçüm aralığı belirlendi; içeri girenlerde kişisel gaz ölçer var"],
   ["Attendant posted at entrance; entry / exit log kept","Girişte gözcü bulunuyor; giriş / çıkış kaydı tutuluyor"],
   ["Rescue equipment at entrance: SCBA, EEBD, tripod / hoist, stretcher, lifeline","Girişte kurtarma ekipmanı: SCBA, EEBD, tripod / vinç, sedye, can halatı"],
   ["Communication with attendant and bridge tested","Gözcü ve köprüüstü ile haberleşme test edildi"],
   ["Adequate lighting; access ladders checked","Yeterli aydınlatma; giriş merdivenleri kontrol edildi"],
   ["Bridge / OOW informed; no cargo / ballast operation on the space","Köprüüstü / vardiya zabiti bilgilendirildi; mahalde yük / balast operasyonu yok"]]},
 hz:[["Oxygen deficiency or toxic / flammable atmosphere","Oksijen eksikliği veya zehirli / yanıcı atmosfer","Enclosed space procedure, gas detector on board, trained crew","Kapalı mahal prosedürü, gemide gaz ölçer, eğitimli personel","U","Ex","Ventilate, test O2 20.9% / LEL <1% / H2S <5 ppm / CO <25 ppm before entry; continuous monitoring; leave immediately on alarm.","Havalandır; girişten önce O2 %20,9 / LEL <%1 / H2S <5 ppm / CO <25 ppm ölç; sürekli izle; alarmda derhal çık.","R"],
  ["Fall from access ladder or platform","Giriş merdiveninden veya platformdan düşme","Ladders inspected, three-point contact rule","Merdivenler kontrol edilmiş, üç nokta temas kuralı","U","Ex","Check ladders and rungs before descent; no carrying of tools in hands (use bag / line); harness where fall risk exists.","İnmeden önce merdiven ve basamakları kontrol et; elde alet taşıma (çanta / halat kullan); düşme riski varsa emniyet kemeri.","R"],
  ["Slips on sediment, mud or wet surfaces; head injury on structure","Tortu, çamur veya ıslak yüzeylerde kayma; yapıya kafa çarpma","Helmet and safety shoes worn","Baret ve emniyet ayakkabısı giyiliyor","L","Mi","Adequate portable lighting; move slowly through lightening holes; remove sediment from walkways first.","Yeterli portatif aydınlatma; ağırlık deliklerinden yavaş geç; önce yürüme yollarındaki tortuyu temizle.","R"],
  ["Delayed rescue of a collapsed person","Yığılan kişinin kurtarılmasında gecikme","Enclosed space rescue drill every 2 months","2 ayda bir kapalı mahal kurtarma talimi","U","Ex","Rescue team and equipment ready at entrance before entry; attendant never enters; raise alarm immediately.","Girişten önce kurtarma ekibi ve ekipmanı girişte hazır; gözcü asla içeri girmez; derhal alarm ver.","M"],
  ["Loss of communication with persons inside","İçerideki kişilerle haberleşme kaybı","UHF radios on board","Gemide UHF telsizler","U","Mo","Agree signals and check-in interval (e.g. every 10 min); exit if contact is lost.","İşaretleri ve kontrol aralığını belirle (örn. 10 dakikada bir); bağlantı kesilirse çık.","R"],
  ["Unexpected ballast / cargo operation or valve opening","Beklenmedik balast / yük operasyonu veya valf açılması","Valves tagged, bridge informed","Valfler etiketli, köprüüstü bilgili","VU","Ex","Lock and tag valves and pumps; notice at ballast control; no operation until permit closed.","Valf ve pompaları kilitle ve etiketle; balast kontrolüne uyarı as; izin kapanana kadar operasyon yok.","CE"]]},
hatch:{name:["Hatch cover / coaming maintenance","Ambar kapağı / mezarna bakımı"],
 loc:["Hatch covers / coamings concerned","İlgili ambar kapakları / mezarnalar"],
 scope:["Inspection and maintenance of hatch covers, coamings, seals and securing devices. No entry into holds unless separately permitted.","Ambar kapakları, mezarnalar, contalar ve kilitlerin kontrolü ve bakımı. Ayrıca izin verilmedikçe ambara giriş yoktur."],
 permit:{type:["General Work Permit (hatch covers)","Genel Çalışma İzni (ambar kapakları)"],party:"AB-1, AB-2",
  ppe:["Helmet, coverall, safety shoes, gloves, goggles","Baret, tulum, emniyet ayakkabısı, eldiven, gözlük"],
  checks:[["Hatch cover hydraulic system isolated / controls tagged when working on covers","Kapak üzerinde çalışırken ambar kapağı hidrolik sistemi izole / kumandalar etiketli"],
   ["Open hatches guarded or covers closed; no work at unguarded hatch edge","Açık ambarlar korumalı veya kapaklar kapalı; korumasız ambar kenarında çalışma yok"],
   ["Covers secured against movement (pins / stoppers in place)","Kapaklar harekete karşı emniyetli (pimler / stoperler takılı)"],
   ["Weather and sea state suitable for deck work","Hava ve deniz durumu güverte çalışmasına uygun"],
   ["Bridge / OOW informed","Köprüüstü / vardiya zabiti bilgilendirildi"]]},

const PER={"1w":{d:7,en:"Weekly",tr:"Haftalık"},"1m":{m:1,en:"Monthly",tr:"Aylık"},"3m":{m:3,en:"3-monthly",tr:"3 aylık"},"6m":{m:6,en:"6-monthly",tr:"6 aylık"},"2m":{m:2,en:"2-monthly",tr:"2 aylık"},"1y":{m:12,en:"Annual",tr:"Yıllık"},"2y":{m:24,en:"2-yearly",tr:"2 yıllık"},"3y":{m:36,en:"3-yearly",tr:"3 yıllık"},"5y":{m:60,en:"5-yearly",tr:"5 yıllık"},"10y":{m:120,en:"10-yearly",tr:"10 yıllık"},"30m":{m:30,en:"30-monthly",tr:"30 aylık"},"36m":{m:36,en:"36-monthly",tr:"36 aylık"},"wn":{en:"When necessary",tr:"Gerektiğinde"}};
const REASONS=[["Bad weather","Kötü hava"],["Cargo operations in progress","Yük operasyonu devam ediyor"],["Spare parts not available","Yedek parça yok"],["Insufficient time / manpower","Zaman / personel yetersiz"],["Requires shore service / dry dock","Kıyı servisi / havuz gerektiriyor"],["Postponed to next opportunity","Bir sonraki fırsata ertelendi"]];

let S={jobs:{},ship:""};
try{const raw=store.get("pms_state");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{store.set("pms_state",JSON.stringify(S));schedulePush()};

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=typeof s==="string"?parse(s):s;return d?pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear():"—"};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function addPer(dStr,p){const d=parse(dStr),P=PER[p];if(!d||!P||(!P.m&&!P.d))return null;
  if(P.d){const r=new Date(d);r.setDate(r.getDate()+P.d);return r}
  const r=new Date(d.getFullYear(),d.getMonth()+P.m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
const lastOf=j=>(S.jobs[j.k]&&S.jobs[j.k].last!==undefined)?S.jobs[j.k].last:j.last;
const RESP={"C/O":["Chief Officer","2. Kaptan (C/O)"],"2/O":["2nd Officer","2. Zabit"],"C/E":["Chief Engineer","Başmühendis"],"SO":["Safety Officer","Emniyet Zabiti"],"GMDSS":["GMDSS Officer","GMDSS Zabiti"],"":["Not assigned","Atanmamış"]};
const RCHIPS=[["all","Hepsi"],["C/O","C/O"],["2/O","2/O"],["C/E","C/E"],["SO","Safety Off."],["GMDSS","GMDSS Off."],["","Atanmamış"]];
const rOf=j=>{const x=S.jobs[j.k];return x&&typeof x.r==="string"?x.r:j.r};
const RNAME={"C/O":"C/O","2/O":"2/O","C/E":"C/E","SO":"Safety Off.","GMDSS":"GMDSS Off.","":"—"};
let resp="all";try{const r=store.get("pms_resp");if(r!==null&&RCHIPS.some(x=>x[0]===r))resp=r}catch(e){}
function status(j){const p=PER[j.p]||{};
  if(j.p==="wn")return{k:"wn",next:null,txt:"Gerektiğinde",cls:""};
  const last=lastOf(j);if(!last)return{k:"nodate",next:null,txt:"Tarih yok",cls:""};
  const next=addPer(last,j.p),days=Math.round((next-today())/864e5);
  const per=p.d||p.m*30,th=per<=7?2:per<=31?7:per<=92?14:30;
  if(days<0)return{k:"over",next,days,txt:`${-days} gün gecikti`,cls:"over"};
  if(days<=th)return{k:"soon",next,days,txt:days===0?"Bugün":`${days} gün kaldı`,cls:"soon"};
  return{k:"ok",next,days,txt:`${days} gün kaldı`,cls:"okk"}}

const FILTERS=[["over","Gecikmiş","over"],["soon","Yaklaşan","soon"],["ok","Zamanında","okk"],["other","Gerektiğinde / tarih yok",""],["all","Tümü",""]];
let filter=null;
function renderList(){
  const pool=JOBS.filter(j=>resp==="all"||rOf(j)===resp);
  $("today").textContent="Bugün "+fmt(today())+" · "+pool.length+" iş · Sorumlu: "+(resp==="all"?"hepsi":RESP[resp][1]);
  $("eb").textContent=(S.ship?S.ship+" · ":"")+"DG PMS";
  $("rchips").innerHTML=RCHIPS.map(([k,l])=>`<button type="button" data-r="${k}" aria-pressed="${resp===k}">${l}<small>${k==="all"?JOBS.length:JOBS.filter(j=>rOf(j)===k).length}</small></button>`).join("");
  const st=pool.map(j=>({j,s:status(j)}));
  const cnt={over:0,soon:0,ok:0,other:0,all:st.length};st.forEach(x=>{if(x.s.k==="over")cnt.over++;else if(x.s.k==="soon")cnt.soon++;else if(x.s.k==="ok")cnt.ok++;else cnt.other++});
  if(filter===null)filter=cnt.over||cnt.soon?"due":"all";
  $("sum").innerHTML=FILTERS.map(([k,l,c])=>`<button class="${c}" data-f="${k}" aria-pressed="${filter===k||(filter==="due"&&(k==="over"||k==="soon"))}"><b>${cnt[k]}</b><span>${l}</span></button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  let rows=st.filter(x=>{const f=filter;if(f==="all")return true;if(f==="due")return x.s.k==="over"||x.s.k==="soon";if(f==="other")return x.s.k==="wn"||x.s.k==="nodate";return x.s.k===f});
  if(q)rows=st.filter(x=>(x.j.n+" "+x.j.tr+" "+RESP[rOf(x.j)][0]+" "+RESP[rOf(x.j)][1]).toLowerCase().includes(q));
  const ord={over:0,soon:1,ok:2,nodate:3,wn:4};
  rows.sort((a,b)=>ord[a.s.k]-ord[b.s.k]||((a.s.next||0)-(b.s.next||0))||a.j.n.localeCompare(b.j.n));
  $("list").innerHTML=rows.length?rows.map(({j,s})=>`<button class="job ${s.cls}" data-i="${JOBS.indexOf(j)}">
    <span class="bar"></span>
    <span class="mid"><span class="nm">${esc(j.n.trim())}</span><span class="tr">${esc(j.tr)}</span>
      <span class="meta"><span>${PER[j.p]?PER[j.p].tr:j.p}</span><span>${RNAME[rOf(j)]}</span><span>Son: ${fmt(lastOf(j))}</span>${s.next?`<span>Sonraki: ${fmt(s.next)}</span>`:""}</span></span>
    <span class="right"><span class="pill ${s.cls}">${s.txt}</span><span class="tags">${j.permit?'<span class="tag p">İZİN</span>':""}${j.cls?'<span class="tag">CLASS</span>':""}${j.psc?'<span class="tag">PSC</span>':""}</span></span></button>`).join(""):`<div class="empty">Bu filtrede iş yok.</div>`;
}
$("rchips").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;resp=b.dataset.r;store.set("pms_resp",resp);filter=null;renderList()};
$("sum").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;$("q").value="";renderList()};
$("q").oninput=renderList;
$("list").onclick=e=>{const b=e.target.closest("[data-i]");if(b)openJob(+b.dataset.i)};

/* ---------- detail ---------- */
let cur=null,sel=[];
function stepsOf(j){const arr=[];
  const hasEntry=j.s.includes("ENTRY");if(j.permit&&!hasEntry)arr.push(L.PERMIT);
  j.s.forEach(s=>arr.push(typeof s==="string"?L[s]:s));return arr}
function openJob(i){cur=JOBS[i];const steps=stepsOf(cur);sel=steps.map(()=>({st:"d",r:0,why:0}));docv=docDefaults(cur);
  $("listView").hidden=true;$("detail").hidden=false;window.scrollTo(0,0);
  try{history.pushState({d:1},"")}catch(e){}
  renderDetail()}
function closeJob(){cur=null;$("detail").hidden=true;$("listView").hidden=false;renderList()}
window.addEventListener("popstate",()=>{if(cur)closeJob()});
function renderDetail(){const j=cur,s=status(j),steps=stepsOf(j),h=(S.jobs[j.k]&&S.jobs[j.k].hist)||[];
  const doneDate=$("dDate")?$("dDate").value:iso(today()), rem=$("rem")?$("rem").value:"";
  $("dwrap").innerHTML=`
  <div class="top"><button class="back" id="back" type="button">‹ Liste</button><span class="pill ${s.cls}">${s.txt}</span></div>
  <div class="dh"><div class="eyebrow">${PER[j.p]?PER[j.p].en+" · "+PER[j.p].tr:j.p} · ${RNAME[rOf(j)]}</div><h2>${esc(j.n.trim())}<span>${esc(j.tr)}</span></h2></div>
  <svg class="waves" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 9 C60 2 120 2 180 8 C240 14 300 14 400 6" fill="none" stroke="#F28C28" stroke-width="3.2" stroke-linecap="round"/><path d="M0 18 C70 12 130 12 190 16 C250 20 320 20 400 14" fill="none" stroke="#F28C28" stroke-width="3.2" stroke-linecap="round"/></svg>
  <div class="facts"><div><small>Periyot</small><b>${PER[j.p]?PER[j.p].tr:j.p}</b></div><div><small>Son yapılma</small><b>${fmt(lastOf(j))}</b></div><div><small>Sonraki</small><b>${s.next?fmt(s.next):"—"}</b></div><div><small>Sorumlu</small><b>${RESP[rOf(j)][1]}</b></div></div>
  <label class="lbl">Sorumlu ata<select id="setResp">${Object.keys(RESP).map(k=>`<option value="${k}"${rOf(j)===k?" selected":""}>${RESP[k][1]} · ${RESP[k][0]}</option>`).join("")}</select></label>${rOf(j)!==j.r?`<p class="note">Excel'de: ${RESP[j.r][1]} · elle değiştirildi</p>`:""}
  <div class="row2"><label class="lbl">Yapıldığı tarih<input type="date" id="dDate" value="${doneDate}"></label><label class="lbl">Son yapılma tarihini düzelt<input type="date" id="fixLast" value="${lastOf(j)||""}"></label></div>
  ${j.permit?'<p class="note">Bu iş için çalışma izni gerekiyor (Excel: Permit).</p>':""}
  <div class="sec">Yapılacak işler · her adım için durumu seç</div>
  <div class="steps">${steps.map((st,k)=>{const v=sel[k];return `<div class="step ${v.st==="n"?"nd":v.st==="x"?"na":""}">
    <div class="t">${esc(st[0])}<span>${esc(st[1])}</span></div>
    <div class="seg" role="group"><button class="d" data-k="${k}" data-st="d" aria-pressed="${v.st==="d"}">Yapıldı</button><button class="n" data-k="${k}" data-st="n" aria-pressed="${v.st==="n"}">Yapılmadı</button><button class="x" data-k="${k}" data-st="x" aria-pressed="${v.st==="x"}">Uygulanmaz</button></div>
    ${v.st==="d"?`<select data-r="${k}" aria-label="Sonuç">${st[2].map((r,ri)=>`<option value="${ri}"${ri===v.r?" selected":""}>${esc(r[1])} · ${esc(r[0])}</option>`).join("")}</select>`:""}
    ${v.st==="n"?`<select data-w="${k}" aria-label="Neden">${REASONS.map((r,ri)=>`<option value="${ri}"${ri===v.why?" selected":""}>${esc(r[1])} · ${esc(r[0])}</option>`).join("")}</select>`:""}
  </div>`}).join("")}</div>
  <label class="lbl">Ek not (raporun sonuna eklenir)<textarea id="rem" placeholder="Örn: 2 adet conta kullanıldı.">${esc(rem)}</textarea></label>
  <div class="sec">Rapor önizleme</div>
  <pre class="report" id="rep"></pre>
  ${docsHTML(j)}
  ${h.length?`<div class="sec">Geçmiş</div><div class="hist">${h.slice(0,6).map(x=>`<div><b>${fmt(x.d)}</b> · ${esc(x.s)}</div>`).join("")}</div>`:""}`;
  $("rep").textContent=buildText("both");refreshDocs();
  $("back").onclick=()=>{try{history.back()}catch(e){closeJob()}setTimeout(()=>{if(cur)closeJob()},300)};
}
$("dwrap").addEventListener("click",e=>{if(e.target.id==="cpPtw"){copyText(buildPTW(cur),"Çalışma izni");return}if(e.target.id==="cpRa"){copyText(buildRA(cur),"Risk değerlendirmesi");return}if(e.target.id==="dlRa"){downloadRA(cur);return}const b=e.target.closest("[data-st]");if(!b)return;const k=+b.dataset.k;sel[k].st=b.dataset.st;renderDetail()});
$("dwrap").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.r!==undefined){sel[+t.dataset.r].r=+t.value}
  else if(t.dataset.w!==undefined){sel[+t.dataset.w].why=+t.value}

    if(h){const r=RA_MX[h[4]][h[5]];F[`B${i}N`]=String(i+1);F[`B${i}L`]=RA_LIK[h[4]].join("\n");F[`B${i}C`]=RA_CON[h[5]].join("\n");F[`B${i}R`]=RA_RISK[r].join("\n")}
    else{F[`B${i}N`]=F[`B${i}L`]=F[`B${i}C`]="-";F[`B${i}R`]="N/A"}}
  const t=buildRA(j).split("\n");
  F.PRES=t.find(l=>l.startsWith("Residual risk"))+"\n"+t.find(l=>l.startsWith("Kalan risk"));
  F.PSTOP=t.find(l=>l.startsWith("Stop work"))+"\n"+t.find(l=>l.startsWith("Güvensiz koşulda"));
  F.PSIGN=t.filter(l=>/: _{6,}/.test(l)).join("\n");
  F.PSCOPE="Scope: "+c.scope[0]+" Confirm location and work plan onboard.\nKapsam: "+c.scope[1]+" Mahal ve iş planını gemide doğrula.";
  return F}
const xesc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let jszipP=null;
function loadJSZip(){if(window.JSZip)return Promise.resolve(window.JSZip);
  return jszipP=jszipP||new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="jszip.min.js";sc.onload=()=>ok(window.JSZip);sc.onerror=()=>{jszipP=null;no(new Error("jszip"))};document.head.appendChild(sc)})}
async function downloadRA(j){
  try{toast("Word dosyası hazırlanıyor…");
    const [JSZip,buf]=await Promise.all([loadJSZip(),fetch("ra_template.docx").then(r=>{if(!r.ok)throw new Error("tpl");return r.arrayBuffer()})]);
    const zip=await JSZip.loadAsync(buf),F=raFields(j);
    let x=await zip.file("word/document.xml").async("string");
    x=x.replace(/<w:t(?: [^>]*)?>\{\{(\w+)\}\}<\/w:t>/g,(m,k)=>'<w:t xml:space="preserve">'+xesc(F[k]!==undefined?F[k]:"").split("\n").join('</w:t><w:br/><w:t xml:space="preserve">')+"</w:t>");
    zip.file("word/document.xml",x);
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const d=$("dDate")?$("dDate").value:iso(today());
    const name=("RA_"+j.n.trim().replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,50)+"_"+d+".docx");
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("İndirildi: "+name)}
  catch(e){toast(e.message==="jszip"||e.message==="tpl"?"Word indirme yüklü uygulamada çalışır (internet ilk seferde gerekli)":"Word dosyası oluşturulamadı")}}

renderList();
</script>
